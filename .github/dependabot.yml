version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /PawsitiveApp
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
